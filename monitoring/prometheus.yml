global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  # C++ Backend Ingest Nodes (MetricsCollector on port 9100)
  - job_name: 'runner_backend'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['runner_1:9100']
        labels:
          node: 'runner_1'
          app: 'runner'
      - targets: ['runner_2:9100']
        labels:
          node: 'runner_2'
          app: 'runner'

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
