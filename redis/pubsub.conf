# Dedicated Pub/Sub radar instance.
# Fire-and-forget bus: no persistence, no AOF, no keys.
port 6379
bind 0.0.0.0
requirepass secret_redis_password

# Pub/Sub messages are never persisted - disable RDB/AOF entirely
save ""
appendonly no

# No keys are stored here; fail fast on accidental writes of big values
maxmemory 128mb
maxmemory-policy noeviction

tcp-keepalive 60
timeout 0
