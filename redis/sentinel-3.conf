port 26379
dir /tmp

sentinel resolve-hostnames no
sentinel announce-hostnames no

# Static test-stand IPs (see docker/docker-compose.yml); identical config on
# all three sentinels, quorum 2 of 3.
sentinel monitor master-0 172.30.0.10 6379 2
sentinel down-after-milliseconds master-0 3000
sentinel failover-timeout master-0 30000

sentinel monitor master-1 172.30.0.11 6381 2
sentinel down-after-milliseconds master-1 3000
sentinel failover-timeout master-1 30000
