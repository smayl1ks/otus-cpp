user nginx;

worker_processes auto;
worker_rlimit_nofile 200000;

events {
    worker_connections 65536;
    use epoll;
    multi_accept on;
}

http {
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 75s;
    keepalive_requests 10000;

    gzip on;
    gzip_types application/json;
    gzip_min_length 1024;

    access_log /var/log/nginx/access.log combined buffer=64k flush=5s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream backend_cluster {
        least_conn;

        # Имена должны совпадать с сервисами docker-compose!
        server cpp_node_1:8080 max_fails=3 fail_timeout=5s;
        server cpp_node_2:8080 max_fails=3 fail_timeout=5s;

        keepalive 512;
        keepalive_requests 100000;
        keepalive_timeout 60s;
    }

    # =========================================================================
    # DEV HTTP Server (порт 80, без SSL)
    # =========================================================================
    server {
        listen 80 default_server;
        server_name _;

        # --- REST API (ingest & auth) ---
        location /api/ {
            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            client_max_body_size 1m;

            proxy_connect_timeout 3s;
            proxy_send_timeout 10s;
            proxy_read_timeout 30s;

            proxy_buffering off;
        }

        location /ws {
            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_read_timeout 4h;
            proxy_send_timeout 4h;

            proxy_buffering off;
        }

        location /metrics {
            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
        }
    }

    # =========================================================================
    # PROD HTTPS Server (порт 443, SSL/TLS)
    # Для включения: смонтируйте сертификаты в /etc/nginx/ssl/ и раскомментируйте
