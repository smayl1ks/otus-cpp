user nginx;
# WS-проксирование удваивает число соединений (клиент + upstream):
# 30k WS-клиентов = ~60k+ коннектов. auto => по воркеру на ядро,
# каждый воркер тянет 65536 соединений.
worker_processes auto;
worker_rlimit_nofile 200000;

events {
    worker_connections 65536;
    use epoll;
    multi_accept on;
}

http {
    # --- Общие тюнинги под большой вебсокет-трафик ---
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 75s;
    keepalive_requests 10000;

    # JSON/protobuf не сжимаем индивидуально: основной трафик - бинарный WS,
    # gzip оставлен только для мелких HTTP API-ответов
    gzip on;
    gzip_types application/json;
    gzip_min_length 1024;

    # Лог под нагрузкой: буферизованный, чтобы не на каждый коннект fsync
    access_log /var/log/nginx/access.log combined buffer=64k flush=5s;

    # Апгрейд соединения до WebSocket (map вместо жёсткого "upgrade")
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream backend_cluster {
        least_conn;

        # Имена должны совпадать с сервисами docker-compose!
        server cpp_node_1:8080 max_fails=3 fail_timeout=5s;
        server cpp_node_2:8080 max_fails=3 fail_timeout=5s;
        # Резерв для горизонтального масштабирования (раскомментировать
        # вместе с добавлением сервисов в docker-compose):
        # server cpp_node_3:8080 max_fails=3 fail_timeout=5s;
        # server cpp_node_4:8080 max_fails=3 fail_timeout=5s;

        # Постоянные соединения к бэкенду: по одному на каждый воркер x буфер
        keepalive 512;
        keepalive_requests 100000;
        keepalive_timeout 60s;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name api.run-uram.ru;

        ssl_certificate /path/to/cert.pem;
        ssl_certificate_key /path/to/key.pem;

        # TLS-хендшейк под 30k подключений: кэш сессий убирает лишние RSA-операции
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:50m;
        ssl_session_timeout 1d;
        ssl_session_tickets on;

        # --- REST API (ingest) ---
        location /api/ {
            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # GPS-батчи - небольшие JSON/protobuf, но пачками
            client_max_body_size 1m;

            proxy_connect_timeout 3s;
            proxy_send_timeout 10s;
            proxy_read_timeout 30s;

            # Стриминг без буферизации: латентность важнее агрегации
            proxy_buffering off;
        }

        # --- WebSocket (LocationBatch ingest + радар) ---
        location /ws {
            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Долгоживущие соединения: бегун в пробежке до 3-4 часов.
            # Таймаут обязан перекрывать длительность пробежки + запас.
            proxy_read_timeout 4h;
            proxy_send_timeout 4h;

            # Пинг/понг keepalive на уровне приложения, nginx не буферизует
            proxy_buffering off;
        }
    }
}
