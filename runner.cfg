[server]
threads = 4
tmp-dir = /tmp/runner/

[network]
address = 0.0.0.0
https.port = 8080
http.port = 8081

[redis]
num_shards = 1
pool_size = 2
master_name = mymaster
sentinels = 127.0.0.1:26379, 127.0.0.1:26380
password = secret_redis_password
connection_timeout_ms = 100
command_timeout_ms = 50
ttl_refresh_interval_sec = 30
# Dedicated pub/sub fleet (radar), sharded by h3_zone. Empty = publish via
# sharded masters. In docker set via env: REDIS_PUBSUB_HOSTS=host:port,host:port
pubsub_hosts =
pubsub_port = 6379
pubsub_password = secret_redis_password

[buffer]
in_memory_capacity = 16384
drain_batch_size = 512

[logger]
dir = /var/log/runner/
# [trace, debug, info, warn, err, critical, off]
level = info
async = true
# Formatting pattern for log messages
pattern = [%Y-%m-%d %H:%M:%S.%f] [%l] %v
# Flush logs to disk every N seconds
flush-interval = 5
