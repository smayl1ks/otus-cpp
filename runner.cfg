# Default configuration for the runner server (dev-friendly paths).
# Override per deployment: command line > config file > RUN_* environment.

server.threads=4
server.tmp-dir=/tmp/runner/tmp

network.address=0.0.0.0
network.http.port=8081
network.https.port=8443
network.websocket.port=9090

ssl.run-ssl=false
ssl.cert=/opt/runner/ssl/cert.pem
ssl.key=/opt/runner/ssl/key.pem

logger.level=info
logger.dir=/tmp/runner/logs
logger.max-size=5242880
logger.max-files=3
logger.flush-interval=3
logger.async=false

# --- STORAGE (redis + circuit-breaker buffer) ---
redis.num_shards=1
redis.pool_size=2
redis.master_name=mymaster
redis.ttl_refresh_interval_sec=30
buffer.in_memory_capacity=16384
buffer.drain_batch_size=512
