# Default configuration for the runner server
# Priority: command line > environment (RUN_*, POSTGRES_*, REDIS_*, ...) > this file

server.threads=4
server.tmp-dir=/tmp/runner/tmp

network.address=0.0.0.0
network.http.port=8081
network.https.port=8443

ssl.run-ssl=false
ssl.cert=/opt/runner/ssl/cert.pem
ssl.key=/opt/runner/ssl/key.pem

auth.jwt-secret=super_secret_jwt_key_runner_987654321

logger.level=info
logger.dir=/tmp/runner/logs
logger.max-size=5242880
logger.max-files=3
logger.flush-interval=3
logger.async=true

# --- DATABASE (postgres) ---
postgres.host=127.0.0.1
postgres.port=5434
postgres.db=run_uram_db
postgres.user=postgres_user
postgres.password=postgres_password

# --- STORAGE (redis fleet) ---
# Empty redis.sentinels = direct mode via redis.host / redis.port
# In docker-compose the REDIS_* environment overrides these values
redis.num-shards=1
redis.master-prefix=master
redis.sentinels=
redis.host=127.0.0.1
redis.port=6379
redis.password=
redis.connection-timeout-ms=2000
