syntax = "proto3";

package run.proto.session;

import "common.proto";
import "telemetry.proto";

enum RunMode {
  RUN_MODE_UNSPECIFIED = 0;
  RUN_MODE_ONLINE = 1;
  RUN_MODE_OFFLINE = 2;
}

enum VisibilityScope {
  VISIBILITY_PRIVATE = 0;    // No radar publication, results visible only to the owner
  VISIBILITY_TEAM_ONLY = 1;  // Radar pinged to team channels only
  VISIBILITY_PUBLIC = 2;     // Radar pinged to public channels
}

enum StartRunRejectReason {
  START_REJECT_REASON_NONE = 0;
  START_REJECT_REASON_ACTIVE_SESSION_EXISTS = 1;  // Another run (different session_id) is still active
  START_REJECT_REASON_USER_BLOCKED = 2;           // Сheating
  START_REJECT_REASON_INVALID_FACTION = 3;        // Specified team_id is invalid or inactive
}

enum FinishRunRejectReason {
  FINISH_REJECT_REASON_NONE = 0;
  FINISH_REJECT_REASON_SESSION_NOT_FOUND = 1;  // session_id does not exist or expired
  FINISH_REJECT_REASON_ALREADY_FINISHED = 2;   // Run was previously closed
  FINISH_REJECT_REASON_INSUFFICIENT_DATA = 3;  // Not enough valid GPS points to compute results
}

enum CancelRunRejectReason {
  CANCEL_REJECT_REASON_NONE = 0;
  CANCEL_REJECT_REASON_SESSION_NOT_FOUND = 1;
  CANCEL_REJECT_REASON_ALREADY_FINISHED = 2; // Finished runs can no longer be cancelled
}

enum OfflineRunRejectReason {
  OFFLINE_REJECT_REASON_NONE = 0;
  OFFLINE_REJECT_REASON_ACTIVE_SESSION_EXISTS = 1; // An active run blocks the upload
  OFFLINE_REJECT_REASON_SESSION_CONFLICT = 2;  // session_id already registered with a different payload
  OFFLINE_REJECT_REASON_INVALID_TIME_RANGE = 3;  // finish_timestamp <= start_timestamp or declared duration exceeds max_duration
  OFFLINE_REJECT_REASON_TOO_MANY_POINTS = 4;   // total_points_count above max_total_points
  OFFLINE_REJECT_REASON_SESSION_NOT_FOUND = 5; // Commit/chunk for a session that was never initialized
  OFFLINE_REJECT_REASON_UPLOAD_NOT_COMPLETE = 6;  // Commit received before every chunk was accepted
  OFFLINE_REJECT_REASON_ALREADY_COMMITTED = 7; // Commit is idempotent: re-request returns the stored summary
}

enum RunValidationReason {
  VALIDATION_REASON_NONE = 0;
  VALIDATION_REASON_TOO_SHORT_DISTANCE = 1;    // distance < min_distance_meters
  VALIDATION_REASON_TOO_SHORT_DURATION = 2;    // duration < min_duration_seconds
  VALIDATION_REASON_TOO_LONG_DISTANCE = 3;     // distance > max_distance_meters
  VALIDATION_REASON_TOO_LONG_DURATION = 4;     // duration > max_duration_seconds
  VALIDATION_REASON_ANTICHEAT_REJECTED = 5;    // Spoofing/mock dominated the track
  VALIDATION_REASON_INSUFFICIENT_VALID_POINTS = 6;  // Too few points survived anticheat
  VALIDATION_REASON_INVALID_TIMESTAMPS = 7;    // Declared start/finish contradict the point timeline
}

enum RunStatus {
  RUN_STATUS_UNSPECIFIED = 0;
  RUN_STATUS_FINISHED = 1;
  RUN_STATUS_CANCELLED = 2;  // Closed by CancelRun; hexes are not scored.
}

message ActiveRunSnapshot {
  string session_id = 1;
  int64 server_run_id = 2;
  RunMode mode = 3;
  int64 started_at = 4;
  double total_distance_meters = 5;
  int32 total_points_count = 6;
  int64 last_sequence_number = 7;  // Client replays batches with sequence_number > this value
}

message RunSummary {
  string session_id = 1;
  int64 server_run_id = 2;
  RunStatus status = 3;

  double total_distance_meters = 4;
  uint32 duration_seconds = 5;
  uint32 moving_duration_seconds = 6;
  uint32 avg_pace_sec_per_km = 7;
  float avg_speed_kmh = 8;
  int32 total_points_count = 9;

  uint32 hexagons_captured_count = 10;
  uint32 total_score = 11;             // Game points ? credited to user/faction totals
  repeated uint64 claimed_hexes = 12;  // Captured H3 indexes (overflow via REST fetch)

  bool is_valid = 13; 
  RunValidationReason validation_reason = 14;

  int64 started_at_ms = 15;
  int64 finished_at_ms = 16;
}

message StartRunRequest {
  string session_id = 1;
  int64 team_id = 2;  // Active faction ID selected for territory capture
  VisibilityScope visibility = 3;
  RunMode mode = 4;
  int64 start_timestamp = 5;
  int64 event_id = 6;    // Linked planned-run event (0 when standalone)
  string device_id = 7;  // Stable installation id (analytics / ban correlation)
  string app_version = 8;
}

message StartRunResponse {
  common.SystemStatus system_status = 1;
  StartRunRejectReason reject_reason = 2;
  string session_id = 3;
  int64 server_run_id = 4;
  int64 server_start_timestamp = 5;       // Server-validated epoch start time
  int64 server_timestamp_ms = 6;          // For client clock-skew estimation
  bool resumed = 7;                       // true = this session_id was already active; snapshot filled
  ActiveRunSnapshot snapshot = 8;         // Present when resumed
  uint32 max_points_per_batch = 9;        // Anticheat rejects larger batches
  uint32 batch_interval_hint_ms = 10;     // Preferred batching cadence
}

message GetActiveRunRequest {}

message GetActiveRunResponse {
  common.SystemStatus system_status = 1;
  ActiveRunSnapshot snapshot = 2; // Unset when the server holds no active run for this user
  uint32 max_points_per_batch = 3;
  uint32 batch_interval_hint_ms = 4;
  int64 server_timestamp_ms = 5;
}

message FinishRunRequest {
  string session_id = 1;
  int64 finish_timestamp = 2;  // Device epoch ms when the user tapped "Finish"
}

message FinishRunResponse {
  common.SystemStatus system_status = 1;
  FinishRunRejectReason reject_reason = 2;
  string session_id = 3;
  RunSummary summary = 4;
  int64 server_timestamp_ms = 5;
}

message CancelRunRequest {
  string session_id = 1;
  int64 client_timestamp = 2;
}

message CancelRunResponse {
  common.SystemStatus system_status = 1;
  CancelRunRejectReason reject_reason = 2;
  string session_id = 3;
  RunSummary summary = 4;
  int64 server_timestamp_ms = 5;
}

// --- Offline runnig flow ---
message OfflineRunInitRequest {
  string session_id = 1;
  int64 team_id = 2;
  VisibilityScope visibility = 3;
  int64 start_timestamp = 4;
  int64 finish_timestamp = 5;
  int64 event_id = 6;
  string device_id = 7;
  string app_version = 8;
  int32 total_points_count = 9;
  int32 total_chunks = 10;
  double client_total_distance_meters = 11;
}

message OfflineRunInitResponse {
  common.SystemStatus system_status = 1;
  OfflineRunRejectReason reject_reason = 2;
  string session_id = 3;
  int64 server_run_id = 4;
  uint32 max_points_per_chunk = 5;
  int32 max_total_points = 6;
  repeated int32 accepted_chunk_indexes = 7;  // Resume point after app restart or lost connection mid-upload
  int64 server_timestamp_ms = 8;
}

message OfflineRunChunkRequest {
  string session_id = 1;
  int32 chunk_index = 2;  // 0-based; chunks may arrive out of order
  int32 total_chunks = 3;
  repeated telemetry.LocationPoint points = 4;
}

message OfflineRunChunkResponse {
  common.SystemStatus system_status = 1;
  OfflineRunRejectReason reject_reason = 2;
  string session_id = 3;
  int32 chunk_index = 4;
  int32 accepted_points_count = 5;
  telemetry.AnticheatStatus anticheat_status = 6;
  int32 received_chunks_count = 7;  // Progress: how many distinct chunks the server holds
  uint32 retry_after_ms = 8;
}

message OfflineRunCommitRequest {
  string session_id = 1;
}

message OfflineRunCommitResponse {
  common.SystemStatus system_status = 1;
  OfflineRunRejectReason reject_reason = 2;
  string session_id = 3;
  RunSummary summary = 4;
  int64 server_timestamp_ms = 5;
}
