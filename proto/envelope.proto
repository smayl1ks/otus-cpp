syntax = "proto3";

package run.proto;

import "location.proto";
import "events.proto";
import "gamemap.proto";

// Common message envelope for multiplexing WebSocket streams
message Envelope {
  // Optional envelope metadata header
  string message_id = 1;        // Unique message tracking ID (UUID)
  int64 timestamp = 2;          // Envelope emission epoch timestamp in milliseconds
  string correlation_id = 3;    // message_id of the request this message answers (WS replies are unordered)
  uint32 protocol_version = 4;  // Envelope schema version, currently 1

  oneof payload {
    // Location batching telemetry
    location.LocationBatch location_batch = 10;

    // Running session lifecycle events
    events.StartRunRequest start_run_request = 20;
    events.StartRunResponse start_run_response = 21;
    events.FinishRunRequest finish_run_request = 22;
    events.FinishRunResponse finish_run_response = 23;
    events.BatchProcessResponse batch_process_response = 24;

    // Gamemap events
    gamemap.SubscribeViewportRequest subscribe_viewport_request = 30;
    gamemap.SubscribeViewportResponse subscribe_viewport_response = 31;
    gamemap.HexagonCaptureEvent hexagon_capture_event = 32;
    
    gamemap.RadarPing radar_ping = 33;
  }
}