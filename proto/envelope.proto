syntax = "proto3";

package run.proto;

import "common.proto";
import "gamemap.proto";
import "session.proto";
import "telemetry.proto";

message Envelope {
  string message_id = 1; // UUID
  int64 timestamp = 2;
  string correlation_id = 3; // message_id of the request this message answers
  uint32 protocol_version = 4;

  oneof payload {
    // --- Telemetry streaming ---
    telemetry.LocationBatch location_batch = 10;
    telemetry.BatchProcessResponse batch_process_response = 11;  // server -> client ack

    // --- Online Running: start / sync / finish / cancel ----
    session.StartRunRequest start_run_request = 20;
    session.StartRunResponse start_run_response = 21;
    session.GetActiveRunRequest get_active_run_request = 22; // client -> server (reconnect sync)
    session.GetActiveRunResponse get_active_run_response = 23;
    session.FinishRunRequest finish_run_request = 24;
    session.FinishRunResponse finish_run_response = 25;
    session.CancelRunRequest cancel_run_request = 26;
    session.CancelRunResponse cancel_run_response = 27;

    // --- Offline Running: init -> chunks -> commit ----
    session.OfflineRunInitRequest offline_run_init_request = 30;
    session.OfflineRunInitResponse offline_run_init_response = 31;
    session.OfflineRunChunkRequest offline_run_chunk_request = 32; // client -> server (repeatable)
    session.OfflineRunChunkResponse offline_run_chunk_response = 33;
    session.OfflineRunCommitRequest offline_run_commit_request = 34;
    session.OfflineRunCommitResponse offline_run_commit_response = 35;

    // --- Gamemap / radar ----
    gamemap.SubscribeViewportRequest subscribe_viewport_request = 40;
    gamemap.SubscribeViewportResponse subscribe_viewport_response = 41;
    gamemap.HexagonCaptureEvent hexagon_capture_event = 42;
    gamemap.RadarPing radar_ping = 43;
  }
}
