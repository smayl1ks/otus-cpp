syntax = "proto3";

package gamemap;

import "common.proto";

message SubscribeViewportRequest {
  // BBox of the camera viewport (with margin). Kept on field numbers 1-4 for
  // wire compatibility: zone-unaware servers handle it as before, zone-aware
  // servers use it only as a fallback when zone_h3 is empty.
  double south_west_lng = 1;
  double south_west_lat = 2;
  double north_east_lng = 3;
  double north_east_lat = 4;

  // Full desired subscription set: H3 res-6 zone indexes. Idempotent: the
  // server diffs this set against the connection's current subscription.
  // fixed64 on purpose — res-6 indexes start with 0x86.., so varint would
  // always take 10 bytes.
  repeated fixed64 zone_h3 = 5;

  // Ask for a full hexagon snapshot of the subscribed area. Set on connect
  // and when the zone set grows; zone-to-zone moves need no snapshot.
  bool need_snapshot = 6;
}

message ViewportHexagon {
  uint64 h3_index = 1;
  uint64 owner_user_id = 2;
  string owner_username = 3;
  string owner_color_hex = 4;
  int32 score = 5;
}

message SubscribeViewportResponse {
  common.SystemStatus status = 1;
  repeated ViewportHexagon hexagons = 2;
}

message HexagonCaptureEvent {
  uint64 h3_index = 1;
  uint64 new_owner_id = 2;
  string new_owner_name = 3;
  string new_owner_color_hex = 4;
  uint64 prev_owner_id = 5;
  int32 score_at_capture = 6;
  int64 timestamp = 7;
}

message RadarPing {
    uint64 user_id = 1;
    uint64 team_id = 2;
    double latitude = 3;
    double longitude = 4;
    float speed = 5;
    int64 timestamp = 6;
}