syntax = "proto3";

package events;

import "common.proto";

// Domain-specific rejection reasons for session initialization.
enum StartRunRejectReason {
  START_REJECT_REASON_NONE = 0;                  // Request accepted.
  START_REJECT_REASON_ACTIVE_SESSION_EXISTS = 1; // User already has an ongoing active run.
  START_REJECT_REASON_USER_BLOCKED = 2;          // Account is suspended or flagged for cheating.
  START_REJECT_REASON_INVALID_FACTION = 3;       // Specified faction ID is invalid or inactive.
}

// Domain-specific rejection reasons for session finalization.
enum FinishRunRejectReason {
  FINISH_REJECT_REASON_NONE = 0;                 // Run finalized successfully.
  FINISH_REJECT_REASON_SESSION_NOT_FOUND = 1;   // Provided session_id does not exist or expired in Redis.
  FINISH_REJECT_REASON_ALREADY_FINISHED = 2;    // Run was previously closed.
  FINISH_REJECT_REASON_INSUFFICIENT_DATA = 3;   // Run rejected due to lack of valid GPS points.
}

enum VisibilityScope {
    VISIBILITY_PRIVATE = 0;
    VISIBILITY_TEAM_ONLY = 1;
    VISIBILITY_PUBLIC = 2;
}

// Request payload to initialize a new running session.
message StartRunRequest {
  string session_id = 1;      // Client generated UUIDv4 for idempotency and trace tracking.
  int64 team_id = 2;          // Active faction ID selected for territory capture.
  VisibilityScope visibility = 3;
  int64 start_timestamp = 4;  // Device epoch time in milliseconds when user tapped "start".
}

message StartRunResponse {
  common.SystemStatus system_status = 1; // Transport/system RPC code.
  StartRunRejectReason reject_reason = 2; // Business rejection reason if start failed.
  string session_id = 3;      // Confirmed workout session ID (UUIDv4).
  int64 server_start_timestamp = 4; // Server-validated epoch start time.
}

message BatchProcessResponse {
  common.SystemStatus system_status = 1; // Transport/system RPC code.
  common.AnticheatStatus anticheat_status = 2;
  string session_id = 3;
  string batch_uuid = 4;
  int64 sequence_number = 5;

  // Server-side run progress snapshot (client live progress without polling)
  int32 accepted_points_count = 6;         // Points of THIS batch that passed anticheat
  double total_distance_meters = 7;        // Accumulated server-validated distance
  int32 total_points_count = 8;            // Accumulated valid points in the session
  int64 server_timestamp_ms = 9;           // Server epoch ms (client clock skew / latency)
  uint32 retry_after_ms = 10;              // Backpressure hint when status is SERVICE_UNAVAILABLE
}

message FinishRunRequest {
  string session_id = 1;      // Session identifier being terminated.
  int64 finish_timestamp = 2; // Device epoch time in milliseconds when user tapped "Finish".
}

message FinishRunResponse {
  common.SystemStatus system_status = 1;           // Transport/system RPC code.
  FinishRunRejectReason reject_reason = 2;        // Business rejection reason if finish failed.

  string session_id = 3;              // Finalized session ID.
  
  double total_distance_meters = 4;   // Total accumulated, server-validated distance.
  uint32 duration_seconds = 5;        // Wall-clock run time (start -> finish).
  uint32 hexes_claimed_count = 6;     // Total H3 cells newly captured or reinforced.
  uint32 total_score = 7;             // Final earned score contributed to user/faction totals.
  float average_speed_kmh = 8;        // Calculated average moving speed across the run.

  uint32 moving_duration_seconds = 9; // Active time excluding pauses (gaps > 3 min).
  repeated uint64 claimed_hexes = 10; // Captured H3 cell indexes (cap: 1000, overflow via separate fetch).
  uint32 track_points_count = 11;     // Valid GPS points stored for the session.
}
