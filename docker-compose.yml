name: runner

services:
  # --- REVERSE PROXY & LOAD BALANCER ---
  nginx:
    image: nginx:alpine
    container_name: run_nginx
    restart: always
    ports:
      - "${NGINX_PORT:-80}:80"
      - "${NGINX_SSL_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./dist:/usr/share/nginx/html:ro
    ulimits:
      nofile:
        soft: 200000
        hard: 200000
    sysctls:
      - net.core.somaxconn=65535
    depends_on:
      runner_1:
        condition: service_healthy
      runner_2:
        condition: service_healthy
    networks:
      - app_network

  # --- APPLICATION NODES ---
  runner_1:
    image: ubuntu:24.04
    container_name: run_cpp_1
    restart: always
    entrypoint: ["/opt/build/runner", "-c", "/etc/runner/runner.cfg"]
    env_file:
      - .env
    environment:
      - NODE_ID=node_1
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in .env}
      - REDIS_NUM_SHARDS=2
      - REDIS_MASTER_NAME=master
      - REDIS_SENTINELS=sentinel-1:26379,sentinel-2:26379,sentinel-3:26379
      - REDIS_PASSWORD=
      - REDIS_CONNECTION_TIMEOUT_MS=2000
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
    volumes:
      - ./build:/opt/build:ro
      - ./runner.cfg:/etc/runner/runner.cfg:ro
      - ./logs/node_1:/tmp/runner/logs
    healthcheck:
      # runner.cfg: network.http.port=8081
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8081"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      sentinel-1:
        condition: service_started
      sentinel-2:
        condition: service_started
      sentinel-3:
        condition: service_started
    networks:
      - app_network

  runner_2:
    image: ubuntu:24.04
    container_name: run_cpp_2
    restart: always
    entrypoint: ["/opt/build/runner", "-c", "/etc/runner/runner.cfg"]
    env_file:
      - .env
    environment:
      - NODE_ID=node_2
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in .env}
      - REDIS_NUM_SHARDS=2
      - REDIS_MASTER_NAME=master
      - REDIS_SENTINELS=sentinel-1:26379,sentinel-2:26379,sentinel-3:26379
      - REDIS_PASSWORD=
      - REDIS_CONNECTION_TIMEOUT_MS=2000
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
    volumes:
      - ./build:/opt/build:ro
      - ./runner.cfg:/etc/runner/runner.cfg:ro
      - ./logs/node_2:/tmp/runner/logs
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8081"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      sentinel-1:
        condition: service_started
      sentinel-2:
        condition: service_started
      sentinel-3:
        condition: service_started
    networks:
      - app_network

  # --- REDIS FLEET (2 shards, master + replica each) ----
  master-0:
    image: redis:7-alpine
    container_name: test-redis-master-0
    restart: always
    command: redis-server --port 6379 --protected-mode no
    ports:
      - "16379:6379" # manual redis-cli debugging only
    networks:
      app_network:
        ipv4_address: 172.30.0.10

  replica-0:
    image: redis:7-alpine
    container_name: test-redis-replica-0
    restart: always
    command: redis-server --port 6379 --replicaof 172.30.0.10 6379 --protected-mode no
    depends_on:
      - master-0
    networks:
      app_network:
        ipv4_address: 172.30.0.12

  master-1:
    image: redis:7-alpine
    container_name: test-redis-master-1
    restart: always
    command: redis-server --port 6381 --protected-mode no
    ports:
      - "16381:6381" # manual redis-cli debugging only
    networks:
      app_network:
        ipv4_address: 172.30.0.11

  replica-1:
    image: redis:7-alpine
    container_name: test-redis-replica-1
    restart: always
    command: redis-server --port 6381 --replicaof 172.30.0.11 6381 --protected-mode no
    depends_on:
      - master-1
    networks:
      app_network:
        ipv4_address: 172.30.0.13

  # --- REDIS SENTINELS (quorum 2 of 3) ---
  sentinel-1:
    image: redis:7-alpine
    container_name: test-redis-sentinel-1
    restart: always
    # Sentinel rewrites its config at runtime -> copy to a writable location.
    command: sh -c "cp /etc/redis-config/sentinel-1.conf /tmp/sentinel.conf && redis-sentinel /tmp/sentinel.conf"
    volumes:
      # Directory mount (not a file): Docker Desktop on WSL poisons file
      # bind-mount staging after a VM restart ("not a directory" errors).
      - ./redis:/etc/redis-config:ro
    ports:
      - "36379:26379"
    depends_on:
      - master-0
      - master-1
    networks:
      app_network:
        ipv4_address: 172.30.0.20

  sentinel-2:
    image: redis:7-alpine
    container_name: test-redis-sentinel-2
    restart: always
    command: sh -c "cp /etc/redis-config/sentinel-2.conf /tmp/sentinel.conf && redis-sentinel /tmp/sentinel.conf"
    volumes:
      # Directory mount (not a file): Docker Desktop on WSL poisons file
      # bind-mount staging after a VM restart ("not a directory" errors).
      - ./redis:/etc/redis-config:ro
    ports:
      - "36380:26379"
    depends_on:
      - master-0
      - master-1
    networks:
      app_network:
        ipv4_address: 172.30.0.21

  sentinel-3:
    image: redis:7-alpine
    container_name: test-redis-sentinel-3
    restart: always
    command: sh -c "cp /etc/redis-config/sentinel-3.conf /tmp/sentinel.conf && redis-sentinel /tmp/sentinel.conf"
    volumes:
      # Directory mount (not a file): Docker Desktop on WSL poisons file
      # bind-mount staging after a VM restart ("not a directory" errors).
      - ./redis:/etc/redis-config:ro
    ports:
      - "36381:26379"
    depends_on:
      - master-0
      - master-1
    networks:
      app_network:
        ipv4_address: 172.30.0.22

  # --- POSTGRESQL + POSTGIS (PERSISTENCE) ---
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: run_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres_user} -d ${POSTGRES_DB:-postgres_db}"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - app_network

  # --- PROMETHEUS (METRICS MONITORING) ---
  prometheus:
    image: prom/prometheus:latest
    container_name: run_prometheus
    restart: always
    volumes:
      - ./monitoring:/etc/prom-config:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prom-config/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - "9090:9090"
    networks:
      - app_network

  # --- GRAFANA (DASHBOARDS, PROVISIONED AUTOMATICALLY) ---
  grafana:
    image: grafana/grafana:11.4.0
    container_name: run_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - app_network

volumes:
  postgres_data:
  grafana_data:
  prometheus_data:

networks:
  app_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
