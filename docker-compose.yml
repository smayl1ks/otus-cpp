version: '3.8'

services:
  # --- REVERSE PROXY & LOAD BALANCER ---
  nginx:
    image: nginx:alpine
    container_name: run_nginx
    restart: always
    ports:
      - "${NGINX_PORT}:80"
      - "${NGINX_SSL_PORT}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - cpp_node_1
      - cpp_node_2
    networks:
      - app_network

  # --- C++ INGEST NODE 1 ---
  cpp_node_1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: run_cpp_1
    restart: always
    env_file:
      - .env
    environment:
      - NODE_ID=node_1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app_network

  # --- C++ INGEST NODE 2 (Scalability Demo) ---
  cpp_node_2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: run_cpp_2
    restart: always
    env_file:
      - .env
    environment:
      - NODE_ID=node_2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app_network

  # --- REDIS (HOT PATH & LEADERBOARDS) ---
  redis:
    image: redis:7-alpine
    container_name: run_redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - app_network

  # --- POSTGRESQL + POSTGIS (PERSISTENCE) ---
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: run_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - app_network

  # --- PROMETHEUS (METRICS MONITORING) ---
  prometheus:
    image: prom/prometheus:latest
    container_name: run_prometheus
    restart: always
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - app_network

volumes:
  postgres_data:
  redis_data:

networks:
  app_network:
    driver: bridge