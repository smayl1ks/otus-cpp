version: '3.8'

services:
  # --- REVERSE PROXY & LOAD BALANCER ---
  nginx:
    image: nginx:alpine
    container_name: run_nginx
    restart: always
    ports:
      - "${NGINX_PORT}:80"
      - "${NGINX_SSL_PORT}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ulimits:
      nofile:
        soft: 200000
        hard: 200000
    sysctls:
      - net.core.somaxconn=65535
    depends_on:
      - cpp_node_1
      - cpp_node_2
    networks:
      - app_network

  # --- C++ INGEST NODE 1 ---
  cpp_node_1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: run_cpp_1
    restart: always
    env_file:
      - .env
    environment:
      - NODE_ID=node_1
      - REDIS_PUBSUB_HOSTS=redis_pubsub_0:6379,redis_pubsub_1:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app_network

  # --- C++ INGEST NODE 2 (Scalability Demo) ---
  cpp_node_2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: run_cpp_2
    restart: always
    env_file:
      - .env
    environment:
      - NODE_ID=node_2
      - REDIS_PUBSUB_HOSTS=redis_pubsub_0:6379,redis_pubsub_1:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app_network

  # --- REDIS ---
  # --- 1. REDIS MASTER ---
  redis:
    image: redis:7-alpine
    container_name: run_redis
    restart: always
    command: redis-server /usr/local/etc/redis/redis.conf --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - ./redis/master.conf:/usr/local/etc/redis/redis.conf:ro
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - app_network
    
  # --- 2. REDIS REPLICA ---
  redis_replica:
    image: redis:7-alpine
    container_name: run_redis_replica
    restart: always
    command: redis-server /usr/local/etc/redis/redis.conf --requirepass ${REDIS_PASSWORD} --masterauth ${REDIS_PASSWORD}
    ports:
      - "6380:6379"
    volumes:
      - ./redis/replica.conf:/usr/local/etc/redis/redis.conf:ro
      - redis_replica_data:/data
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - app_network

  # --- 3. DEDICATED PUB/SUB FLEET (RADAR, CLIENT-SIDE CHANNEL SHARDING) ---
  # Fire-and-forget broadcast bus for kazan:zone:* radar channels.
  # Channels are sharded by hash(h3_zone) % N across the fleet;
  # no persistence: pub/sub messages are ephemeral by design.
  redis_pubsub_0:
    image: redis:7-alpine
    container_name: run_redis_pubsub_0
    restart: always
    command: redis-server /usr/local/etc/redis/pubsub.conf --requirepass ${REDIS_PUBSUB_PASSWORD:-${REDIS_PASSWORD}}
    ports:
      - "6381:6379"
    volumes:
      - ./redis/pubsub.conf:/usr/local/etc/redis/pubsub.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PUBSUB_PASSWORD:-${REDIS_PASSWORD}}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - app_network

  redis_pubsub_1:
    image: redis:7-alpine
    container_name: run_redis_pubsub_1
    restart: always
    command: redis-server /usr/local/etc/redis/pubsub.conf --requirepass ${REDIS_PUBSUB_PASSWORD:-${REDIS_PASSWORD}}
    ports:
      - "6382:6379"
    volumes:
      - ./redis/pubsub.conf:/usr/local/etc/redis/pubsub.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PUBSUB_PASSWORD:-${REDIS_PASSWORD}}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - app_network

  # --- 4. REDIS SENTINEL ---
  redis_sentinel:
    image: redis:7-alpine
    container_name: run_redis_sentinel
    restart: always
    command: redis-sentinel /etc/redis/sentinel.conf
    ports:
      - "26379:26379"
    volumes:
      - ./redis/sentinel.conf:/etc/redis/sentinel.conf
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - app_network

  # --- POSTGRESQL + POSTGIS (PERSISTENCE) ---
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: run_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - app_network

  # --- PROMETHEUS (METRICS MONITORING) ---
  prometheus:
    image: prom/prometheus:latest
    container_name: run_prometheus
    restart: always
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - app_network

volumes:
  postgres_data:
  redis_data:
  redis_replica_data:

networks:
  app_network:
    driver: bridge